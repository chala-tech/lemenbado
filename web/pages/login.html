<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E5972F" />
  <meta name="description" content="Log in to Lemenbado." />

  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Log in — Lemenbado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="app-shell">

    <header class="nav">
      <div class="container nav__inner">
        <a href="../index.html" class="nav__logo">
          <svg class="nav__logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="#E5972F" stroke-width="1.5" />
            <path d="M4 14 H24" stroke="#2A3557" stroke-width="1.5" stroke-dasharray="2 2.5" />
            <circle cx="6" cy="14" r="2.5" fill="#E5972F" />
            <circle cx="22" cy="14" r="2.5" fill="#0A0F1C" stroke="#E5972F" stroke-width="1.5" />
          </svg>
          Lemenbado
        </a>
        <div class="nav__actions">
          <a class="btn btn--ghost btn--sm" href="../index.html">Back to home</a>
        </div>
      </div>
    </header>

    <main class="container container--narrow page">

      <div class="card auth-card">
        <div class="page-header">
          <span class="hero__eyebrow">Welcome back</span>
          <h1>Log in to Lemenbado</h1>
          <p class="page-header__subtitle">Enter your email and password to continue.</p>
        </div>

        <form class="form" id="login-form" novalidate>

          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" required />
          </div>

          <div class="form__actions">
            <button class="btn btn--primary btn--full" type="submit" id="submit-btn">Log in</button>
          </div>
        </form>

        <p class="auth-card__foot">New here? <a href="register.html">Create an account</a></p>
      </div>

    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__note">Lemenbado · pilot build</span>
        <span class="footer__note">Fewer empty legs on the Addis corridors.</span>
      </div>
    </footer>

  </div>

  <script src="../js/app.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      try {
        const result = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });

        Session.set({ token: result.token, user: result.user });
        window.location.href = 'dashboard.html';
      } catch (err) {
        showFormError(form, err.message || 'Login failed. Check your email and password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
