<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E5972F" />
  <meta name="description" content="Your Lemenbado bookings — requested, accepted, in transit, and completed." />

  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Bookings — Lemenbado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="app-shell">

    <header class="nav">
      <div class="container nav__inner">
        <a href="../index.html" class="nav__logo">
          <svg class="nav__logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="#E5972F" stroke-width="1.5" />
            <path d="M4 14 H24" stroke="#2A3557" stroke-width="1.5" stroke-dasharray="2 2.5" />
            <circle cx="6" cy="14" r="2.5" fill="#E5972F" />
            <circle cx="22" cy="14" r="2.5" fill="#0A0F1C" stroke="#E5972F" stroke-width="1.5" />
          </svg>
          Lemenbado
        </a>

        <nav class="nav__links" aria-label="Primary">
          <a class="nav__link" href="dashboard.html">Dashboard</a>
          <a class="nav__link" id="nav-secondary" href="publish-availability.html">Availability</a>
          <a class="nav__link" href="matches.html">Matches</a>
          <a class="nav__link nav__link--active" href="bookings.html" aria-current="page">Bookings</a>
        </nav>

        <div class="nav__actions">
          <a class="btn btn--ghost btn--sm" href="#" id="logout-link">Log out</a>
          <a class="nav__avatar" href="profile.html" id="nav-avatar" aria-label="Your profile">--</a>
        </div>
      </div>
    </header>

    <main class="container page">

      <div class="page-header">
        <span class="hero__eyebrow">Bookings</span>
        <h1>Your bookings</h1>
        <p class="page-header__subtitle">Every request you've sent or received, in one place — tap a booking for the full timeline.</p>
      </div>

           <div class="tabs" role="tablist" aria-label="Filter by status" id="tabs">
        <button class="tab" role="tab" aria-selected="true" data-status="ALL">All</button>
        <button class="tab" role="tab" aria-selected="false" data-status="REQUESTED">Awaiting reply</button>
        <button class="tab" role="tab" aria-selected="false" data-status="ACCEPTED">Confirmed</button>
        <button class="tab" role="tab" aria-selected="false" data-status="IN_TRANSIT">On the way</button>
        <button class="tab" role="tab" aria-selected="false" data-status="COMPLETED">Done</button>
        <button class="tab" role="tab" aria-selected="false" data-status="CANCELLED">Cancelled</button>
      </div>

      <div id="booking-list" style="display: flex; flex-direction: column; gap: var(--space-4);"></div>

      <div class="card" id="empty-state" style="display: none; text-align: center; color: var(--color-ink-faint);">
        No bookings in this status yet.
      </div>

    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__note">Lemenbado · pilot build</span>
        <span class="footer__note">Fewer empty legs on the Addis corridors.</span>
      </div>
    </footer>

  </div>

  <script src="../js/app.js"></script>
  <script>
   
    function fmtDate(value) {
      if (!value) return '—';
      return new Date(value).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

  let allBookings = [];
let user;

async function init() {
  user = requireSession();
  if (!user) return;

      document.getElementById('nav-avatar').textContent = (user.name || 'U').split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('nav-secondary').textContent = user.role === 'TRUCK_OWNER' ? 'Availability' : 'Post cargo';
      document.getElementById('nav-secondary').href = user.role === 'TRUCK_OWNER' ? 'publish-availability.html' : 'post-cargo.html';

      try {
        allBookings = await apiFetch('/bookings');
      } catch (err) {
        document.getElementById('booking-list').innerHTML = `<div class="card" style="color: var(--color-alert);">${err.message}</div>`;
        return;
      }

      renderBookings('ALL');

      document.getElementById('tabs').addEventListener('click', (event) => {
        const tab = event.target.closest('.tab');
        if (!tab) return;
        document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', 'false'));
        tab.setAttribute('aria-selected', 'true');
        renderBookings(tab.dataset.status);
      });
    }

        const PAGE_SIZE = 20;
    let visibleCount = PAGE_SIZE;

    function renderBookings(filter) {
      visibleCount = PAGE_SIZE; // reset when switching tabs
      renderVisible(filter);
    }

    function renderVisible(filter) {
      const items = filter === 'ALL' ? allBookings : allBookings.filter((b) => b.status === filter);
      const shown = items.slice(0, visibleCount);
      const list = document.getElementById('booking-list');
      const emptyState = document.getElementById('empty-state');

      list.innerHTML = shown.map((b) => {

        const origin = b.truck_availability?.origin_city?.name || '—';
        const dest = b.truck_availability?.dest_city?.name || '—';
        const weight = b.cargo_request ? Number(b.cargo_request.weight_kg).toLocaleString() + ' kg' : '';
        return `
          <a class="card avail-card" href="booking-detail.html?id=${b.id}" style="display:flex;">
            <div class="avail-card__top">
              <span class="avail-card__route">${origin} <span class="avail-card__route-arrow">→</span> ${dest}</span>
             <span class="badge ${BOOKING_STATUS_BADGE[b.status] || 'badge--wait'}">${bookingStatusLabel(b, user.id)}</span>
            </div>
            <div class="avail-card__meta">
              <span class="data">${weight}</span>
              <span class="data">${fmtDate(b.created_at)}</span>
            </div>
          </a>
        `;
          }).join('');

      emptyState.style.display = items.length === 0 ? 'block' : 'none';

      const existingBtn = document.getElementById('load-more-btn');
      if (existingBtn) existingBtn.remove();

      if (items.length > visibleCount) {
        const btn = document.createElement('button');
        btn.id = 'load-more-btn';
        btn.className = 'btn btn--ghost';
        btn.style.marginTop = 'var(--space-4)';
        btn.textContent = `Load more (${items.length - visibleCount} remaining)`;
        btn.addEventListener('click', () => {
          visibleCount += PAGE_SIZE;
          renderVisible(document.querySelector('.tab[aria-selected="true"]').dataset.status);
        });
        list.after(btn);
      }
    }

    init();
  </script>
</body>
</html>
