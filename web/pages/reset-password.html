<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E5972F" />
  <meta name="description" content="Set a new Lemenbado password." />

  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Set new password — Lemenbado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <!-- Only page in the app that talks to Supabase directly — needed
       to complete the password-recovery link's session client-side. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="app-shell">

    <header class="nav">
      <div class="container nav__inner">
        <a href="../index.html" class="nav__logo">
          <svg class="nav__logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="#E5972F" stroke-width="1.5" />
            <path d="M4 14 H24" stroke="#2A3557" stroke-width="1.5" stroke-dasharray="2 2.5" />
            <circle cx="6" cy="14" r="2.5" fill="#E5972F" />
            <circle cx="22" cy="14" r="2.5" fill="#0A0F1C" stroke="#E5972F" stroke-width="1.5" />
          </svg>
          Lemenbado
        </a>
        <div class="nav__actions">
          <a class="btn btn--ghost btn--sm" href="../index.html">Back to home</a>
        </div>
      </div>
    </header>

    <main class="container container--narrow page">

      <div class="card auth-card">
        <div class="page-header">
          <span class="hero__eyebrow">Reset password</span>
          <h1>Set a new password</h1>
          <p class="page-header__subtitle" id="page-subtitle">Checking your reset link…</p>
        </div>

        <form class="form" id="reset-form" style="display:none;" novalidate>
          <div class="field">
            <label class="field__label" for="password">New password</label>
            <input class="input" type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required />
          </div>

          <div class="field" id="confirm-field">
            <label class="field__label" for="confirm">Confirm new password</label>
            <input class="input" type="password" id="confirm" name="confirm" required />
          </div>

          <div class="form__actions">
            <button class="btn btn--primary btn--full" type="submit" id="submit-btn">Set new password</button>
          </div>
        </form>

        <div id="invalid-link" style="display:none;">
          <p style="color: var(--color-alert); margin-bottom: var(--space-4);">
            This reset link is invalid or has expired.
          </p>
          <a class="btn btn--primary" href="forgot-password.html">Request a new link</a>
        </div>
      </div>

    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__note">Lemenbado · pilot build</span>
        <span class="footer__note">Helping Ethiopian trucks carry more, and drive less empty.</span>
      </div>
    </footer>

  </div>

  <script>
  
   SUPABASE_URL="https://rdqsjekoqkdzigkgeyje.supabase.co"
SUPABASE_ANON_KEY="sb_publishable_ZXxtxAzRHQIIhag0PM8r_g_iujAdquW"

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const subtitle = document.getElementById('page-subtitle');
    const form = document.getElementById('reset-form');
    const invalidLink = document.getElementById('invalid-link');

    // Supabase's client automatically reads the recovery token from the
    // URL when the page loads (from the link in the email) and fires
    // this event once that session is established.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        subtitle.textContent = 'Enter your new password below.';
        form.style.display = 'flex';
      }
    });

    // If no recovery session shows up shortly after load, the link was
    // invalid, already used, or expired.
    setTimeout(async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session && form.style.display === 'none') {
        subtitle.textContent = '';
        invalidLink.style.display = 'block';
      }
    }, 2500);

    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const confirmField = document.getElementById('confirm-field');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (password.value.length < 8) {
        alert('Password must be at least 8 characters.');
        return;
      }

      const passwordsMatch = password.value === confirm.value;
      confirmField.classList.toggle('field--invalid', !passwordsMatch);
      if (!passwordsMatch) {
        alert("Passwords don't match.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      const { error } = await supabaseClient.auth.updateUser({ password: password.value });

      if (error) {
        alert(error.message || 'Could not update password. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set new password';
        return;
      }

      form.innerHTML = `
        <p style="color: var(--color-signal); font-size: var(--text-base); margin-bottom: var(--space-4);">
          Password updated! You can now log in with your new password.
        </p>
        <a class="btn btn--primary btn--full" href="login.html">Go to login</a>`;
    });
  </script>
</body>
</html>
