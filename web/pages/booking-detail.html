<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E5972F" />
  <meta name="description" content="Booking details and status timeline — Lemenbado." />

  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Booking details — Lemenbado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="app-shell">

    <header class="nav">
      <div class="container nav__inner">
        <a href="../index.html" class="nav__logo">
          <svg class="nav__logo-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="#E5972F" stroke-width="1.5" />
            <path d="M4 14 H24" stroke="#2A3557" stroke-width="1.5" stroke-dasharray="2 2.5" />
            <circle cx="6" cy="14" r="2.5" fill="#E5972F" />
            <circle cx="22" cy="14" r="2.5" fill="#0A0F1C" stroke="#E5972F" stroke-width="1.5" />
          </svg>
          Lemenbado
        </a>

        <nav class="nav__links" aria-label="Primary">
          <a class="nav__link" href="dashboard.html">Dashboard</a>
          <a class="nav__link" id="nav-secondary" href="publish-availability.html">Availability</a>
          <a class="nav__link" href="matches.html">Matches</a>
          <a class="nav__link nav__link--active" href="bookings.html" aria-current="page">Bookings</a>
        </nav>

        <div class="nav__actions">
          <a class="btn btn--ghost btn--sm" href="#" id="logout-link">Log out</a>
          <a class="nav__avatar" href="profile.html" id="nav-avatar" aria-label="Your profile">--</a>
        </div>
      </div>
    </header>

    <main class="container page">

      <a class="btn btn--ghost btn--sm" href="bookings.html" style="margin-bottom: var(--space-5);">← All bookings</a>

      <div id="detail-root"><!-- populated by script --></div>

    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__note">Lemenbado · pilot build</span>
        <span class="footer__note">Fewer empty legs on the Addis corridors.</span>
      </div>
    </footer>

  </div>

  <script src="../js/app.js"></script>
  <script>
    const STEPS = ['REQUESTED', 'ACCEPTED', 'IN_TRANSIT', 'DELIVERED', 'COMPLETED'];
const STEP_LABELS = {
  REQUESTED: 'Awaiting reply', ACCEPTED: 'Confirmed', IN_TRANSIT: 'On the way',
  DELIVERED: 'Arrived', COMPLETED: 'Done',
};
    const STATUS_BADGE = {
      REQUESTED: 'badge--wait', ACCEPTED: 'badge--wait', IN_TRANSIT: 'badge--wait',
      DELIVERED: 'badge--wait', COMPLETED: 'badge--signal', CANCELLED: 'badge--alert', REJECTED: 'badge--alert',
    };

    // must match ALLOWED_TRANSITIONS in api/src/modules/bookings/bookings.service.ts
    const ALLOWED_TRANSITIONS = {
      REQUESTED: ['ACCEPTED', 'REJECTED', 'CANCELLED'],
      ACCEPTED: ['IN_TRANSIT', 'CANCELLED'],
      IN_TRANSIT: ['DELIVERED', 'CANCELLED'],
      DELIVERED: ['COMPLETED'],
      COMPLETED: [],
      REJECTED: [],
      CANCELLED: [],
    };

    let user;
    let booking;
    const root = document.getElementById('detail-root');

    function fmtDate(value) {
      if (!value) return '—';
      return new Date(value).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    async function init() {
      user = requireSession();
      if (!user) return;

      document.getElementById('nav-avatar').textContent = (user.name || 'U').split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('nav-secondary').textContent = user.role === 'TRUCK_OWNER' ? 'Availability' : 'Post cargo';
      document.getElementById('nav-secondary').href = user.role === 'TRUCK_OWNER' ? 'publish-availability.html' : 'post-cargo.html';

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      try {
        // no GET /api/bookings/:id endpoint yet — fetch the full list
        // and find this one. Fine at pilot scale.
        const all = await apiFetch('/bookings');
        booking = all.find((b) => b.id === id) || null;
      } catch (err) {
        root.innerHTML = `<div class="card" style="color: var(--color-alert);">${err.message}</div>`;
        return;
      }

      render();
    }

    function stepperHtml(status) {
      if (status === 'CANCELLED' || status === 'REJECTED') {
        return `<div class="card" style="border-color: var(--color-alert); background-color: var(--color-alert-tint);">
          <p style="color: var(--color-alert); font-weight: var(--weight-semibold); margin-bottom: var(--space-2);">
            This booking was ${status === 'REJECTED' ? 'rejected' : 'cancelled'}.
          </p>
        </div>`;
      }
      const current = STEPS.indexOf(status);
      return `<div class="stepper">${STEPS.map((step, i) => `
        <div class="stepper__step ${i < current ? 'stepper__step--done' : ''} ${i === current ? 'stepper__step--current' : ''}">
          <span class="stepper__line"></span>
          <span class="stepper__dot"></span>
          <span class="stepper__label">${STEP_LABELS[step]}</span>
        </div>
      `).join('')}</div>`;
    }

    function actionsHtml() {
      const status = booking.status;
      const allowed = ALLOWED_TRANSITIONS[status] || [];
      const isRequester = booking.requested_by_user_id === user.id;

      if (allowed.length === 0) {
        if (status === 'COMPLETED') {
          return `<button class="btn btn--ghost" id="review-btn" type="button">Leave a review</button>`;
        }
        return '';
      }

      // the person who made the request shouldn't accept/reject their own
      // request — only the counterpart can respond to a REQUESTED booking
      if (status === 'REQUESTED' && isRequester) {
        return `
          <p class="field__hint" style="margin-bottom: var(--space-3);">Waiting for a response from the other party.</p>
          <button class="btn btn--ghost btn--sm" data-action="CANCELLED" type="button">Cancel request</button>`;
      }

        const buttons = allowed.map((next) => {
        if (status === 'REQUESTED' && next === 'ACCEPTED') return `<button class="btn btn--primary" data-action="ACCEPTED" type="button">Accept this booking</button>`;
        if (status === 'REQUESTED' && next === 'REJECTED') return `<button class="btn btn--ghost" data-action="REJECTED" type="button">Decline</button>`;
        if (next === 'IN_TRANSIT') return `<button class="btn btn--primary" data-action="IN_TRANSIT" type="button">I've picked up the cargo</button>`;
        if (next === 'DELIVERED') return `<button class="btn btn--primary" data-action="DELIVERED" type="button">I've delivered it</button>`;
        if (next === 'COMPLETED') return `<button class="btn btn--primary" data-action="COMPLETED" type="button">Confirm everything went well</button>`;
        if (next === 'CANCELLED') return `<button class="btn btn--ghost btn--sm" data-action="CANCELLED" type="button">Cancel</button>`;
        return '';
      });

      return buttons.join('');
    }

    function render() {
      if (!booking) {
        root.innerHTML = `
          <div class="card" style="text-align:center;">
            <h2>Booking not found</h2>
            <p class="page-header__subtitle" style="margin-inline:auto;">This booking doesn't exist, or you're not a participant in it.</p>
            <a class="btn btn--primary" href="bookings.html" style="margin-top: var(--space-4);">Back to bookings</a>
          </div>`;
        return;
      }

      const origin = booking.truck_availability?.origin_city?.name || '—';
      const dest = booking.truck_availability?.dest_city?.name || '—';

      // which side of this booking is the current viewer on? determines
      // which half of the match is "theirs" (skip it, they already know
      // it) vs "the other side" (show it — that's the useful part)
      const isTruckSide = booking.truck_availability?.truck?.owner_id === user.id;

      const weight = booking.cargo_request ? Number(booking.cargo_request.weight_kg).toLocaleString() : '—';
      const cargoType = booking.cargo_request?.cargo_type?.name?.toLowerCase() || 'cargo';
      const requiredDate = fmtDate(booking.cargo_request?.required_date);
      const plate = booking.truck_availability?.truck?.plate_number || '—';
      const truckTypeName = booking.truck_availability?.truck?.truck_type?.name?.toLowerCase() || 'truck';
      const capacity = booking.truck_availability ? Number(booking.truck_availability.available_capacity_kg).toLocaleString() : '—';

      const counterpartHtml = isTruckSide
        ? `<p class="field__label" style="margin-bottom: var(--space-3);">What you're carrying</p>
           <p style="color: var(--color-ink); margin-bottom: var(--space-2);">
             <strong>${weight} kg</strong> of ${cargoType}, needed by <strong>${requiredDate}</strong>.
           </p>`
        : `<p class="field__label" style="margin-bottom: var(--space-3);">Your matched truck</p>
           <p style="color: var(--color-ink); margin-bottom: var(--space-2);">
             A <strong>${truckTypeName}</strong> (plate <strong>${plate}</strong>) with room for up to
             <strong>${capacity} kg</strong>.
           </p>`;

      root.innerHTML = `
        <div class="page-header">
          <span class="hero__eyebrow">Booking</span>
          <h1>${origin} → ${dest}</h1>
          <span class="badge ${STATUS_BADGE[booking.status] || 'badge--wait'}">${STEP_LABELS[booking.status] || booking.status}</span>
        </div>

        ${stepperHtml(booking.status)}

        <div class="split split--form">
          <div class="card">
            ${counterpartHtml}

            <div class="form__actions" style="margin-top: var(--space-5); flex-direction: column; align-items: flex-start;">
              ${actionsHtml()}
            </div>
          </div>

          <div class="card">
            <p class="field__label" style="margin-bottom: var(--space-3);">Contact</p>
            <p class="field__hint">
              Direct contact details aren't wired up yet on this build — for now, coordinate through the counterpart's
              listed truck/cargo info above until in-app contact info sharing is added.
            </p>
          </div>
        </div>
      `;

      root.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
              const ACTION_LABEL = {
              ACCEPTED: 'Booking confirmed.', REJECTED: 'Booking declined.',
              IN_TRANSIT: 'Marked as picked up — on the way now.', DELIVERED: 'Marked as delivered.',
              COMPLETED: "Done — thanks for confirming!", CANCELLED: 'Booking cancelled.',
            };
            await apiFetch(`/bookings/${booking.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ status: btn.dataset.action }),
            });
            const all = await apiFetch('/bookings');
            booking = all.find((b) => b.id === booking.id);
            render();
            showToast(ACTION_LABEL[btn.dataset.action] || 'Booking updated.');
          } catch (err) {
            alert(err.message || 'Could not update this booking.');
            btn.disabled = false;
          }
        });
      });

      const reviewBtn = document.getElementById('review-btn');
      if (reviewBtn) {
        reviewBtn.addEventListener('click', async () => {
          const rating = prompt('Rate this delivery from 1 to 5:');
          const ratingNum = Number(rating);
          if (!rating || ratingNum < 1 || ratingNum > 5 || !Number.isInteger(ratingNum)) {
            alert('Please enter a whole number from 1 to 5.');
            return;
          }
          const comment = prompt('Optional comment:') || undefined;

          try {
            await apiFetch('/reviews', {
              method: 'POST',
              body: JSON.stringify({ bookingId: booking.id, rating: ratingNum, comment }),
            });
            showToast('Review submitted — thank you!');
            reviewBtn.disabled = true;
            reviewBtn.textContent = 'Review submitted';
          } catch (err) {
            alert(err.message || 'Could not submit review.');
          }
        });
      }
    }

    init();
  </script>
</body>
</html>
